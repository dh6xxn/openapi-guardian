name: Live API Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jsonplaceholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm install
      - run: npm run build
      - name: Validate public API contract
        run: node dist/cli.js validate examples/jsonplaceholder.yaml
      - name: Test JSONPlaceholder live API
        run: node dist/cli.js test examples/jsonplaceholder.yaml --base-url https://jsonplaceholder.typicode.com
