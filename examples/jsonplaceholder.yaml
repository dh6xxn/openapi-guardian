openapi: 3.0.3
info:
  title: JSONPlaceholder Smoke Test
  version: 1.0.0
servers:
  - url: https://jsonplaceholder.typicode.com
paths:
  /posts/1:
    get:
      responses:
        '200':
          description: A post
          content:
            application/json:
              schema:
                type: object
                required:
                  - userId
                  - id
                  - title
                  - body
                properties:
                  userId:
                    type: integer
                  id:
                    type: integer
                  title:
                    type: string
                  body:
                    type: string
